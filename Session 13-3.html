<body>
    <script>
        let randomNumbers = prompt ('Hay nhap vao day so bat ky, ngan cach boi dau phay :');
        let numberArray = randomNumbers.split(",");
        let reverseNumbers = numberArray.reverse();
        alert ('Mang sau khi dao nguoc la : ' + reverseNumbers.join(" , ") );
    </script>
